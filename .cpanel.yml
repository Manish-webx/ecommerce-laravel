---
deployment:
  tasks:
    # Define the path where the application will be served (e.g., public_html)
    - export DEPLOYPATH=/home/laravelbp/public_html/

    # Change directory to the repository path on the server
    - cd /home/laravelbp/repositories/ecommerce-laravel

    # Pull the latest code (this is automatically handled by the webhook)
    - /usr/local/bin/git pull

    # Install/update composer dependencies
    - /opt/cpanel/composer/bin/composer install --no-dev --prefer-dist

    # Move the application files to the DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH

    # Move the sensitive root files to a private location
    - /bin/cp -R .env $DEPLOYPATH
    - /bin/cp -R vendor $DEPLOYPATH

    # Change directory to the public directory for artisan commands
    - cd $DEPLOYPATH

    # Run Laravel commands (ensure PHP CLI path is correct, sometimes just 'php' works)
    - /usr/local/bin/php artisan migrate --force
    - /usr/local/bin/php artisan cache:clear
    - /usr/local/bin/php artisan view:clear